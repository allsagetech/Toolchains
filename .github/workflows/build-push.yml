# #>
name: Build Toolchain Packages

on:
  push:
    # Dependabot already exercises the pull_request path. Ignore its companion
    # branch-push event so a dependency refresh does not fan out 73 duplicate
    # package candidate builds.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  schedule:
    - cron: '9 2 */4 * *'
  workflow_dispatch:
    inputs:
      package:
        description: Package name or path to publish (for example, podman or src/pkgs/podman.ps1)
        required: false
        type: string
      full_inventory:
        description: Explicitly publish the enabled package inventory (large-model jobs are disabled)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Immutable Toolchain consumer used for package execution and local image contracts.
  # Update only after the corresponding Toolchain commit has passed its release gates.
  TOOLCHAIN_REPO: allsagetech/toolchain
  TOOLCHAIN_REF: 581d176d85371bbbff80d10432ebf5ad29b20435
  TLC_DOCKER_REPO: ${{ vars.TLC_DOCKER_REPO || 'allsagetech/toolchains' }}

jobs:
  init:
    name: Select package matrix
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.init.outputs.matrix }}
      has-packages: ${{ steps.init.outputs.has-packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze packages
        id: init
        shell: pwsh
        env:
          MANUAL_PACKAGE: ${{ inputs.package }}
          MANUAL_FULL_INVENTORY: ${{ inputs.full_inventory }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1

          function New-MatrixEntry([IO.FileInfo]$Script, [bool]$ForceBuild) {
            Clear-TlcPackageScript
            & $Script.FullName
            Test-TlcPackageScript

            $runsOn = Get-TlcPackageRunsOn
            $publishRunsOn = Get-TlcPackagePublishRunsOn
            $tier = if ($TlcPackageConfig.Tier) { [string]$TlcPackageConfig.Tier } else { 'tooling' }
            $publicationState = Get-TlcPackagePublicationState
            [pscustomobject]@{
              package = $Script.FullName.Replace((Get-Location).Path, '.')
              runs_on = $runsOn
              publish_runs_on = $publishRunsOn
              tier = $tier
              force_build = $ForceBuild
              verified_downloads = $publicationState.VerifiedDownloads
              publish_eligible = $publicationState.PublishEligible
              quarantine_reason = $publicationState.QuarantineReason
              unverified_download_reason = if ($publicationState.VerifiedDownloads) { '' } else { [string]$TlcPackageConfig.UnverifiedDownloadReason }
              pkg_root = Get-TlcPkgRootForRunner -RunsOn $runsOn
              cache_path = Get-TlcCachePathForRunner -RunsOn $runsOn
              publish_pkg_root = Get-TlcPkgRootForRunner -RunsOn $publishRunsOn
              publish_cache_path = Get-TlcCachePathForRunner -RunsOn $publishRunsOn
            }
          }

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseRef = "origin/$env:GITHUB_BASE_REF"
            $changed = @(& git diff --name-only "$baseRef...HEAD" -- 'src/pkgs/**/*.ps1' 'src/pkgs/*.ps1')
            if ($LASTEXITCODE -ne 0) { throw "git diff failed for $baseRef...HEAD" }

            # Always exercise one real Windows package and one real Linux package.
            $paths = @('src/pkgs/websocat.ps1', 'src/pkgs/git-linux.ps1') + $changed
            $entries = @()
            foreach ($path in ($paths | Sort-Object -Unique)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
              $entry = New-MatrixEntry (Get-Item -LiteralPath $path) $true
              # Large models retain their dedicated self-hosted release runner and never
              # execute untrusted pull-request code there. Their schemas are still covered
              # by the required validation job.
              if ($entry.tier -eq 'model-large') {
                Write-Host "Skipping large-model PR build on a self-hosted runner: $path"
                continue
              }
              if (-not [bool]$entry.verified_downloads -or -not [bool]$entry.publish_eligible) {
                Write-Output "::warning file=$path,title=Package quarantined::$($entry.quarantine_reason)"
                continue
              }
              $entries += $entry
            }
          } else {
            $entries = @()
            if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $refSelector = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '^.*/', '' } else { '' }
              $selectedReleaseScript = Get-ChildItem -Path .\src\pkgs -Filter *.ps1 -Recurse -File |
                Where-Object {
                  "$refSelector.ps1" -eq $_.Name -or
                    ($refSelector -and $refSelector.StartsWith("$($_.BaseName)-"))
                } |
                Select-Object -First 1

              if ($selectedReleaseScript) {
                Write-Host "Package-specific ref selected $($selectedReleaseScript.FullName)."
                $entries = @(New-MatrixEntry $selectedReleaseScript $false)
              } else {
                $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
                $before = [string]$event.before
                $after = [string]$event.after
                if ($after -notmatch '^[0-9a-fA-F]{40}$') {
                  $after = (& git rev-parse HEAD).Trim()
                  if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the pushed commit.' }
                }
                if ($after -notmatch '^[0-9a-fA-F]{40}$') {
                  throw 'Could not resolve the pushed commit.'
                }

                if ($before -match '^0{40}$') {
                  $changed = @(& git diff-tree --root --no-commit-id --name-only -r $after)
                } elseif ($before -match '^[0-9a-fA-F]{40}$') {
                  $changed = @(& git diff --name-only $before $after --)
                } else {
                  $changed = @()
                  $global:LASTEXITCODE = 1
                }

                if ($LASTEXITCODE -ne 0) {
                  Write-Output '::warning title=Push diff fallback::The previous commit was unavailable; selecting from the files recorded in the push event.'
                  $changed = @()
                  foreach ($commit in @($event.commits)) {
                    $changed += @($commit.added) + @($commit.modified) + @($commit.removed)
                  }
                  if ($changed.Count -eq 0) {
                    $changed = @(& git show --pretty='' --name-only $after --)
                    if ($LASTEXITCODE -ne 0) { throw "Could not determine files changed by push $after." }
                  }
                }

                $paths = @(Get-TlcPushPackagePaths -ChangedPath $changed)
                Write-Host "Push changed $(@($changed | Sort-Object -Unique).Count) files and selected $($paths.Count) package jobs."
                foreach ($path in $paths) {
                  $entries += New-MatrixEntry (Get-Item -LiteralPath $path) $false
                }
              }
            } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $fullInventory = $env:MANUAL_FULL_INVENTORY -eq 'true'
              if ($fullInventory) {
                Write-Host 'Explicit full-inventory manual run selected.'
                Save-WorkflowMatrix
                $obj = Get-Content -LiteralPath .matrix -Raw | ConvertFrom-Json
                $entries = @($obj.include)
              } else {
                $selector = ([string]$env:MANUAL_PACKAGE).Trim() -replace '\\', '/'
                $selector = $selector -replace '^(\./)+', '' -replace '^src/pkgs/', '' -replace '\.ps1$', ''
                if ([string]::IsNullOrWhiteSpace($selector)) {
                  throw "Manual runs require a package selector unless 'full_inventory' is explicitly enabled."
                }

                $packageScripts = @(Get-ChildItem -Path .\src\pkgs -Filter *.ps1 -Recurse -File)
                $selectedScripts = @($packageScripts | Where-Object {
                  $relative = $_.FullName.Substring((Join-Path (Get-Location).Path 'src\pkgs').Length).TrimStart([char[]]@('\', '/')) -replace '\\', '/' -replace '\.ps1$', ''
                  $_.BaseName -ieq $selector -or $relative -ieq $selector
                })
                if ($selectedScripts.Count -eq 0) {
                  throw "No package script matches manual selector '$selector'."
                }
                if ($selectedScripts.Count -gt 1) {
                  throw "Manual package selector '$selector' is ambiguous: $($selectedScripts.FullName -join ', ')"
                }

                Write-Host "Manual run selected $($selectedScripts[0].FullName)."
                $entries = @(New-MatrixEntry $selectedScripts[0] $false)
              }
            } else {
              # Scheduled runs remain the automatic complete inventory sweep.
              Save-WorkflowMatrix
              $obj = Get-Content -LiteralPath .matrix -Raw | ConvertFrom-Json
              $entries = @($obj.include)
            }

            foreach ($entry in @($entries | Where-Object { -not [bool]$_.verified_downloads -or -not [bool]$_.publish_eligible })) {
              Write-Output "::warning file=$($entry.package),title=Package quarantined::$($entry.quarantine_reason)"
            }
            $entries = @($entries | Where-Object { [bool]$_.verified_downloads -and [bool]$_.publish_eligible })

            foreach ($entry in @($entries | Where-Object { [string]$_.tier -eq 'model-large' })) {
              Write-Output "::notice file=$($entry.package),title=Large-model job disabled::Large-model publication is disabled to avoid unavailable self-hosted runner jobs."
            }
            $entries = @($entries | Where-Object { [string]$_.tier -ne 'model-large' })

            if ($entries.Count -eq 0) {
              Write-Host 'No publication-eligible outdated packages were discovered.'
            }

            $isMainPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
            $isScheduled = $env:GITHUB_EVENT_NAME -eq 'schedule'
            $isManual = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'
            $isProtectedRelease = $env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF.StartsWith('refs/heads/release/')

            $entries = @($entries | Where-Object {
              $tier = if ($_.tier) { [string]$_.tier } else { 'tooling' }
              $baseName = [IO.Path]::GetFileNameWithoutExtension([string]$_.package)
              $normalizedRefName = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME -replace '^.*/', '' } else { '' }
              $matchesRef = $normalizedRefName -and (
                $normalizedRefName -eq $baseName -or $normalizedRefName.StartsWith("$baseName-")
              )

              if (-not $isProtectedRelease) {
                return $tier -eq 'tooling'
              }
              return ($tier -eq 'tooling') -or
                ($tier -eq 'model-small' -and ($isMainPush -or $isScheduled -or $isManual -or $matchesRef))
            })

            foreach ($entry in $entries) {
              $entry | Add-Member -NotePropertyName force_build -NotePropertyValue $false -Force
            }
          }

          Clear-TlcPackageScript
          $matrix = ConvertTo-Json @{ include = @($entries) } -Depth 50 -Compress
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $hasPackages = ([bool](@($entries).Count -gt 0)).ToString().ToLowerInvariant()
          "has-packages=$hasPackages" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  validate:
    name: Validate (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts and package metadata (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\test-toolchains.ps1

      - name: Validate scripts and package metadata (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\scripts\test-toolchains.ps1

      - name: Validate versioned package specification (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\test-package-spec.ps1

      - name: Validate versioned package specification (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\scripts\test-package-spec.ps1

      - name: Report packages quarantined from publication (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          $quarantined = @()
          foreach ($script in Get-ChildItem -Path .\src\pkgs -Filter *.ps1 -Recurse -File) {
            Clear-TlcPackageScript
            & $script.FullName
            Test-TlcPackageScript
            $publicationState = Get-TlcPackagePublicationState
            if (-not $publicationState.PublishEligible) {
              Write-Output "::warning file=$($script.FullName),title=Publication quarantined::$($TlcPackageConfig.Name): $($publicationState.QuarantineReason)"
              $quarantined += $TlcPackageConfig.Name
            }
          }
          Clear-TlcPackageScript
          Write-Host "Quarantined package count: $($quarantined.Count)"

      - name: Report packages quarantined from publication (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          $quarantined = @()
          foreach ($script in Get-ChildItem -Path .\src\pkgs -Filter *.ps1 -Recurse -File) {
            Clear-TlcPackageScript
            & $script.FullName
            Test-TlcPackageScript
            $publicationState = Get-TlcPackagePublicationState
            if (-not $publicationState.PublishEligible) {
              Write-Output "::warning file=$($script.FullName),title=Publication quarantined::$($TlcPackageConfig.Name): $($publicationState.QuarantineReason)"
              $quarantined += $TlcPackageConfig.Name
            }
          }
          Clear-TlcPackageScript
          Write-Host "Quarantined package count: $($quarantined.Count)"

  scanner-smoke:
    name: Scanner bootstrap (${{ matrix.name }})
    needs: [init, validate]
    if: ${{ github.event_name != 'pull_request' && needs.init.outputs.has-packages == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap Syft and generate a smoke SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/scanner-smoke.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Bootstrap Trivy and run a smoke scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          version: v0.73.0
          cache: true
          timeout: 10m

  pr-smoke:
    name: PR smoke (${{ matrix.package }})
    needs: [init, validate]
    if: ${{ github.event_name == 'pull_request' && needs.init.outputs.has-packages == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    env:
      TLC_PKG_ROOT: ${{ matrix.pkg_root }}
      TLC_REQUIRE_VERIFIED_DOWNLOADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce verified-download publication policy
        if: matrix.verified_downloads != true || matrix.publish_eligible != true
        shell: pwsh
        env:
          QUARANTINE_REASON: ${{ matrix.quarantine_reason }}
        run: |
          throw "Package is quarantined from CI builds/publication: $env:QUARANTINE_REASON"

      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Toolchain contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: allsagetech/toolchain
          ref: f6088e16872964cc8b5f4618a8e1bc0596822e32
          path: .ci/toolchain-contract
          persist-credentials: false

      - name: Install pinned Toolchain module
        shell: pwsh
        run: .\scripts\install-toolchain.ps1 -Repo $env:TOOLCHAIN_REPO -Ref $env:TOOLCHAIN_REF

      - name: Prepare Linux package mount
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ROOT: ${{ matrix.pkg_root }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$PACKAGE_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_ROOT"

      - name: Prepare package root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $full = [IO.Path]::GetFullPath($env:TLC_PKG_ROOT)
          if ($full.TrimEnd('\','/') -eq [IO.Path]::GetPathRoot($full).TrimEnd('\','/')) {
            throw "Unsafe package root: $full"
          }
          if (Test-Path -LiteralPath $full) {
            if ($env:RUNNER_OS -eq 'Linux') {
              Get-ChildItem -LiteralPath $full -Force | Remove-Item -Recurse -Force
            } else {
              Remove-Item -LiteralPath $full -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path $full -Force | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            if (Test-Path -LiteralPath 'C:\pkg') { Remove-Item -LiteralPath 'C:\pkg' -Recurse -Force }
            cmd /c "mklink /J C:\pkg `"$full`"" | Out-Null
          }

      - name: Start Docker daemon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          if (-not $service) {
            $dockerd = Get-Command dockerd -ErrorAction Stop
            $dockerRoot = Join-Path $env:RUNNER_TEMP 'docker-data'
            New-Item -ItemType Directory -Path $dockerRoot -Force | Out-Null
            Start-Process -FilePath $dockerd.Source -ArgumentList @('--host','npipe:////./pipe/docker_engine','--data-root',$dockerRoot) -WindowStyle Hidden
          }
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          throw 'Docker daemon did not become ready.'

      - name: Force package lifecycle and build candidate image once
        id: image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          Clear-TlcPackageScript
          $scriptPath = (Resolve-Path '${{ matrix.package }}').Path
          & $scriptPath
          Test-TlcPackageScript

          Invoke-TlcInit
          $TlcPackageConfig.Latest = [TlcSemanticVersion]::new()
          $TlcPackageConfig.Tags = @()
          $TlcPackageConfig.UpToDate = $false
          Install-TlcPackage
          if ($TlcPackageConfig.UpToDate) {
            throw 'A forced PR smoke build marked itself up-to-date without producing a package.'
          }
          Test-TlcPackageInstall
          Assert-TlcDefinitionFile | Out-Null

          $dockerIgnore = Join-Path $env:TLC_PKG_ROOT '.dockerignore'
          if (-not (Test-Path -LiteralPath $dockerIgnore)) {
            @('cache/','_stage/','artifacts/','*.tmp') | Set-Content -LiteralPath $dockerIgnore -Encoding utf8
          }
          $safeVersion = ([string]$TlcPackageConfig.Version).Replace('+','_')
          $imageRef = "toolchains-pr-smoke:$($TlcPackageConfig.Name)-$safeVersion-$env:GITHUB_RUN_ID"
          $dockerfileName = if ($TlcPackageConfig.Dockerfile) { [string]$TlcPackageConfig.Dockerfile } else { $null }
          Invoke-DockerBuild $imageRef $TlcPackageConfig.Name $TlcPackageConfig.Version $dockerfileName
          $imageId = (& docker image inspect --format '{{.Id}}' $imageRef | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $imageId) { throw "Could not resolve image ID for $imageRef" }

          "image=$imageRef" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image-id=$imageId" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($TlcPackageConfig.Name)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($TlcPackageConfig.Version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate exact image with pinned Toolchain contract
        shell: pwsh
        run: |
          .\.github\scripts\Test-LocalImageContract.ps1 `
            -ImageRef '${{ steps.image.outputs.image }}' `
            -ExpectedImageId '${{ steps.image.outputs.image-id }}' `
            -PackageName '${{ steps.image.outputs.name }}' `
            -PackageVersion '${{ steps.image.outputs.version }}' `
            -PackageRoot $env:TLC_PKG_ROOT `
            -ToolchainSource .\.ci\toolchain-contract

  candidate-build:
    name: Candidate (${{ matrix.package }})
    needs: [init, validate]
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && needs.init.outputs.has-packages == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    env:
      TLC_PKG_ROOT: ${{ matrix.pkg_root }}
      TLC_REQUIRE_VERIFIED_DOWNLOADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enforce verified-download build policy
        if: matrix.verified_downloads != true || matrix.publish_eligible != true
        shell: pwsh
        env:
          QUARANTINE_REASON: ${{ matrix.quarantine_reason }}
        run: |
          throw "Package is quarantined from CI builds: $env:QUARANTINE_REASON"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Toolchain module
        shell: pwsh
        run: .\scripts\install-toolchain.ps1 -Repo $env:TOOLCHAIN_REPO -Ref $env:TOOLCHAIN_REF

      - name: Prepare Linux package mount
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ROOT: ${{ matrix.pkg_root }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$PACKAGE_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_ROOT"

      - name: Prepare package root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $full = [IO.Path]::GetFullPath($env:TLC_PKG_ROOT)
          if ($full.TrimEnd('\','/') -eq [IO.Path]::GetPathRoot($full).TrimEnd('\','/')) { throw "Unsafe package root: $full" }
          if (Test-Path -LiteralPath $full) {
            if ($env:RUNNER_OS -eq 'Linux') {
              Get-ChildItem -LiteralPath $full -Force | Remove-Item -Recurse -Force
            } else {
              Remove-Item -LiteralPath $full -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path (Join-Path $full 'cache') -Force | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            if (Test-Path -LiteralPath 'C:\pkg') { Remove-Item -LiteralPath 'C:\pkg' -Recurse -Force }
            cmd /c "mklink /J C:\pkg `"$full`"" | Out-Null
          }

      - name: Run package lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          Clear-TlcPackageScript
          Invoke-TlcScript (Resolve-Path '${{ matrix.package }}').Path

      - name: Scan Windows package payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:TLC_PKG_ROOT '.tlc')) {
            . .\src\main.ps1
            Invoke-TlcPackageScan
          } else {
            Write-Host 'Package became up-to-date after matrix selection; no payload to scan.'
          }

  release:
    name: Release (${{ matrix.package }})
    needs: [init, validate, scanner-smoke]
    if: ${{ needs.init.outputs.has-packages == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ${{ matrix.publish_runs_on }}
    timeout-minutes: 720
    environment: package-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    env:
      TLC_PKG_ROOT: ${{ matrix.publish_pkg_root }}
      TLC_REQUIRE_VERIFIED_DOWNLOADS: '1'
    steps:
      - name: Enforce verified-download publication policy
        if: matrix.verified_downloads != true || matrix.publish_eligible != true
        shell: pwsh
        env:
          QUARANTINE_REASON: ${{ matrix.quarantine_reason }}
        run: |
          throw "Package is quarantined from publication: $env:QUARANTINE_REASON"

      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Toolchain contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: allsagetech/toolchain
          ref: f6088e16872964cc8b5f4618a8e1bc0596822e32
          path: .ci/toolchain-contract
          persist-credentials: false

      - name: Install pinned Toolchain module
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\install-toolchain.ps1 -Repo $env:TOOLCHAIN_REPO -Ref $env:TOOLCHAIN_REF -Token $env:GH_TOKEN

      - name: Prepare Linux package mount
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ROOT: ${{ matrix.publish_pkg_root }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$PACKAGE_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$PACKAGE_ROOT"

      - name: Prepare package storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $full = [IO.Path]::GetFullPath($env:TLC_PKG_ROOT)
          if ($full.TrimEnd('\','/') -eq [IO.Path]::GetPathRoot($full).TrimEnd('\','/')) { throw "Unsafe package root: $full" }
          if (Test-Path -LiteralPath $full) {
            Get-ChildItem -LiteralPath $full -Force | Where-Object Name -ne 'cache' | Remove-Item -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path $full -Force | Out-Null
          }
          New-Item -ItemType Directory -Path (Join-Path $full 'cache') -Force | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            if (Test-Path -LiteralPath 'C:\pkg') { Remove-Item -LiteralPath 'C:\pkg' -Recurse -Force }
            cmd /c "mklink /J C:\pkg `"$full`"" | Out-Null
          }

      - name: Cache verified downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.publish_cache_path }}
          key: release-cache-${{ runner.os }}-${{ hashFiles('src/util.ps1', 'src/pkgs/**') }}
          restore-keys: release-cache-${{ runner.os }}-

      - name: Run package lifecycle
        id: pkg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          Clear-TlcPackageScript
          Invoke-TlcScript (Resolve-Path '${{ matrix.package }}').Path

          "up-to-date=$([bool]$TlcPackageConfig.UpToDate)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($TlcPackageConfig.Name)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($TlcPackageConfig.Version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vex=$([string]$TlcPackageConfig.Vex)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Scan Windows package payload
        if: runner.os == 'Windows' && steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          . .\src\main.ps1
          Invoke-TlcPackageScan

      - name: Start Docker daemon (Windows)
        if: runner.os == 'Windows' && steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') { Start-Service docker }
          if (-not $service) {
            $dockerd = Get-Command dockerd -ErrorAction Stop
            $dockerRoot = Join-Path $env:RUNNER_TEMP 'docker-data'
            New-Item -ItemType Directory -Path $dockerRoot -Force | Out-Null
            Start-Process -FilePath $dockerd.Source -ArgumentList @('--host','npipe:////./pipe/docker_engine','--data-root',$dockerRoot) -WindowStyle Hidden
          }
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { docker version; exit 0 }
            Start-Sleep -Seconds 2
          }
          throw 'Docker daemon did not become ready.'

      - name: Verify Docker daemon (Linux)
        if: runner.os == 'Linux' && steps.pkg.outputs.up-to-date == 'False'
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Build candidate OCI image once
        id: image
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\main.ps1
          Clear-TlcPackageScript
          & (Resolve-Path '${{ matrix.package }}').Path
          $TlcPackageConfig.Name = '${{ steps.pkg.outputs.name }}'
          $TlcPackageConfig.Version = '${{ steps.pkg.outputs.version }}'

          $dockerIgnore = Join-Path $env:TLC_PKG_ROOT '.dockerignore'
          if (-not (Test-Path -LiteralPath $dockerIgnore)) {
            @('cache/','_stage/','artifacts/','*.tmp') | Set-Content -LiteralPath $dockerIgnore -Encoding utf8
          }

          $safeVersion = ([string]$TlcPackageConfig.Version).Replace('+','_')
          $candidate = "toolchains-candidate:$($TlcPackageConfig.Name)-$safeVersion-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $dockerfileName = if ($TlcPackageConfig.Dockerfile) { [string]$TlcPackageConfig.Dockerfile } else { $null }
          Invoke-DockerBuild $candidate $TlcPackageConfig.Name $TlcPackageConfig.Version $dockerfileName
          $imageId = (& docker image inspect --format '{{.Id}}' $candidate | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $imageId) { throw "Could not resolve image ID for $candidate" }

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          "image=$candidate" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image-id=$imageId" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Candidate image: $candidate ($imageId)"

      - name: Generate SPDX SBOM from exact candidate image
        id: sbom
        if: steps.pkg.outputs.up-to-date == 'False'
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: artifacts/${{ steps.pkg.outputs.name }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Scan exact candidate image
        id: trivy
        if: steps.pkg.outputs.up-to-date == 'False'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: ${{ steps.pkg.outputs.vex }}
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: sarif
          output: artifacts/${{ steps.pkg.outputs.name }}.trivy.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          version: v0.73.0
          cache: true
          timeout: 30m

      - name: Upload scan evidence
        if: always() && steps.pkg.outputs.up-to-date == 'False'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ steps.pkg.outputs.name }}-${{ github.run_attempt }}
          path: |
            artifacts/${{ steps.pkg.outputs.name }}.trivy.sarif
            artifacts/${{ steps.pkg.outputs.name }}.spdx.json
            ${{ steps.pkg.outputs.vex }}
          if-no-files-found: warn
          retention-days: 30

      - name: Generate fallback SPDX SBOM with Trivy
        id: fallback-sbom
        if: always() && steps.pkg.outputs.up-to-date == 'False' && steps.sbom.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trivy = Get-Command trivy -ErrorAction Stop
          & $trivy.Source image --format spdx-json --output "artifacts/${{ steps.pkg.outputs.name }}.spdx.json" '${{ steps.image.outputs.image }}'
          if ($LASTEXITCODE -ne 0) { throw "Trivy fallback SBOM generation failed with exit code $LASTEXITCODE." }

      - name: Enforce supply-chain evidence gate
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        env:
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          SBOM_FALLBACK_OUTCOME: ${{ steps.fallback-sbom.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          $sbomPath = "artifacts/$env:PACKAGE_NAME.spdx.json"
          $sarifPath = "artifacts/$env:PACKAGE_NAME.trivy.sarif"

          if (-not (Test-Path -LiteralPath $sbomPath -PathType Leaf)) {
            $failures += 'SBOM scanner infrastructure failed before producing SPDX evidence.'
          } elseif ($env:SBOM_OUTCOME -ne 'success' -and $env:SBOM_FALLBACK_OUTCOME -ne 'success') {
            $failures += 'Primary and fallback SBOM scanners reported failure.'
          }

          if ($env:TRIVY_OUTCOME -ne 'success') {
            if (Test-Path -LiteralPath $sarifPath -PathType Leaf) {
              $sarif = Get-Content -LiteralPath $sarifPath -Raw | ConvertFrom-Json
              $findingCount = @($sarif.runs | ForEach-Object { @($_.results) }).Count
              if ($findingCount -gt 0) {
                $failures += "Trivy found $findingCount HIGH/CRITICAL vulnerability result(s)."
              } else {
                $failures += 'Trivy failed after creating an empty SARIF report; treat this as scanner infrastructure failure.'
              }
            } else {
              $failures += 'Trivy scanner infrastructure failed before producing SARIF evidence.'
            }
          }

          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Output "::error title=Supply-chain gate::$failure" }
            throw ($failures -join ' ')
          }

      - name: Contract-test exact candidate image with pinned Toolchain
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          .\.github\scripts\Test-LocalImageContract.ps1 `
            -ImageRef '${{ steps.image.outputs.image }}' `
            -ExpectedImageId '${{ steps.image.outputs.image-id }}' `
            -PackageName '${{ steps.pkg.outputs.name }}' `
            -PackageVersion '${{ steps.pkg.outputs.version }}' `
            -PackageRoot $env:TLC_PKG_ROOT `
            -ToolchainSource .\.ci\toolchain-contract

      - name: Record build provenance predicate
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          $predicate = [ordered]@{
            builder = @{ id = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" }
            buildType = 'https://github.com/allsagetech/toolchains/.github/workflows/build-push.yml@v1'
            invocation = @{
              configSource = @{ uri = "git+https://github.com/$env:GITHUB_REPOSITORY@$env:GITHUB_SHA"; digest = @{ sha1 = $env:GITHUB_SHA } }
              parameters = @{ package = '${{ matrix.package }}'; runner = '${{ join(matrix.publish_runs_on, ',') }}'; vex = '${{ steps.pkg.outputs.vex }}' }
              environment = @{ runnerOS = $env:RUNNER_OS; runnerArch = $env:RUNNER_ARCH }
            }
            metadata = @{ buildInvocationId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"; completeness = @{ parameters = $true; environment = $true; materials = $true }; reproducible = $false }
            materials = @(@{ uri = "git+https://github.com/$env:GITHUB_REPOSITORY"; digest = @{ sha1 = $env:GITHUB_SHA } })
            candidateImageId = '${{ steps.image.outputs.image-id }}'
          }
          $predicate | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'artifacts/${{ steps.pkg.outputs.name }}.provenance.json' -Encoding utf8

      - name: Login to Docker Hub
        if: steps.pkg.outputs.up-to-date == 'False'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Install verified Cosign
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: .\.github\scripts\Install-VerifiedCosign.ps1

      - name: Publish tested image to a unique staging digest
        id: publish
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $safeVersion = '${{ steps.pkg.outputs.version }}'.Replace('+','_')
          $finalTag = "${env:TLC_DOCKER_REPO}:${{ steps.pkg.outputs.name }}-$safeVersion"
          $stagingTagName = "staging-${{ steps.pkg.outputs.name }}-$safeVersion-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stagingTag = "${env:TLC_DOCKER_REPO}:$stagingTagName"

          docker manifest inspect $finalTag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite immutable package tag: $finalTag" }

          docker tag '${{ steps.image.outputs.image }}' $stagingTag
          $stagedId = (& docker image inspect --format '{{.Id}}' $stagingTag | Out-String).Trim()
          if ($stagedId -cne '${{ steps.image.outputs.image-id }}') {
            throw "Staging changed image identity: expected ${{ steps.image.outputs.image-id }}, got $stagedId"
          }

          docker push $stagingTag
          if ($LASTEXITCODE -ne 0) { throw "docker push failed for $stagingTag" }
          $remoteManifest = (& docker manifest inspect --verbose $stagingTag | Out-String) | ConvertFrom-Json
          $remoteDigest = [string]$remoteManifest.Descriptor.digest
          if ($remoteDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Could not resolve published repository digest for $stagingTag"
          }
          $repoDigest = "$env:TLC_DOCKER_REPO@$remoteDigest"

          "staging-tag=$stagingTag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "staging-tag-name=$stagingTagName" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "final-tag=$finalTag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "digest-ref=$repoDigest" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "digest=$(($repoDigest -split '@',2)[1])" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign and attest the published digest
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest-ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DIGEST_REF) { throw 'Published digest reference is empty.' }
          cosign sign --yes $env:DIGEST_REF
          if ($LASTEXITCODE -ne 0) { throw 'cosign sign failed.' }
          cosign attest --yes --type spdxjson --predicate 'artifacts/${{ steps.pkg.outputs.name }}.spdx.json' $env:DIGEST_REF
          if ($LASTEXITCODE -ne 0) { throw 'cosign SBOM attestation failed.' }
          cosign attest --yes --type slsaprovenance --predicate 'artifacts/${{ steps.pkg.outputs.name }}.provenance.json' $env:DIGEST_REF
          if ($LASTEXITCODE -ne 0) { throw 'cosign provenance attestation failed.' }

      - name: Verify signature and attestations fail closed
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        timeout-minutes: 10
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest-ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = "https://github.com/$env:GITHUB_WORKFLOW_REF"
          $issuer = 'https://token.actions.githubusercontent.com'

          function Invoke-CosignVerification {
            param(
              [Parameter(Mandatory=$true)][string]$Description,
              [Parameter(Mandatory=$true)][string[]]$Arguments,
              [int]$MaxAttempts = 2,
              [int]$TimeoutSeconds = 75
            )

            $cosign = Get-Command cosign -ErrorAction Stop
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "$Description (attempt $attempt/$MaxAttempts)"
              $startInfo = [Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $cosign.Source
              $startInfo.UseShellExecute = $false
              $startInfo.CreateNoWindow = $true
              $startInfo.RedirectStandardOutput = $true
              $startInfo.RedirectStandardError = $true
              foreach ($argument in $Arguments) { [void]$startInfo.ArgumentList.Add($argument) }

              $process = [Diagnostics.Process]::new()
              $process.StartInfo = $startInfo
              try {
                if (-not $process.Start()) { throw "could not start $($cosign.Source)" }
                $stdoutTask = $process.StandardOutput.ReadToEndAsync()
                $stderrTask = $process.StandardError.ReadToEndAsync()
                $finished = $process.WaitForExit($TimeoutSeconds * 1000)
                if (-not $finished) {
                  try { $process.Kill($true) } catch { try { $process.Kill() } catch { } }
                  if (-not $process.WaitForExit(10000)) {
                    throw "$Description could not terminate its timed-out process tree."
                  }
                }

                $stdout = $stdoutTask.GetAwaiter().GetResult().Trim()
                $stderr = $stderrTask.GetAwaiter().GetResult().Trim()
                if ($stdout) { Write-Host $stdout }
                if ($stderr) { Write-Host $stderr }

                if (-not $finished) {
                  $reason = "timed out after $TimeoutSeconds seconds"
                } elseif ($process.ExitCode -eq 0) {
                  return
                } else {
                  $reason = "failed with exit code $($process.ExitCode)"
                }
              } finally {
                $process.Dispose()
              }

              if ($attempt -lt $MaxAttempts) {
                $delay = [math]::Pow(2, $attempt)
                Write-Warning "$Description $reason; retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }

            throw "$Description $reason after $MaxAttempts attempts."
          }

          $identityArguments = @('--timeout', '60s', '--certificate-identity', $identity, '--certificate-oidc-issuer', $issuer)
          Invoke-CosignVerification -Description 'Published signature verification' -Arguments (@('verify') + $identityArguments + $env:DIGEST_REF)
          Invoke-CosignVerification -Description 'Published SBOM attestation verification' -Arguments (@('verify-attestation', '--type', 'spdxjson') + $identityArguments + $env:DIGEST_REF)
          Invoke-CosignVerification -Description 'Published provenance attestation verification' -Arguments (@('verify-attestation', '--type', 'slsaprovenance') + $identityArguments + $env:DIGEST_REF)

      - name: Promote signed digest to immutable version tag without rebuilding
        if: steps.pkg.outputs.up-to-date == 'False'
        shell: pwsh
        env:
          SIGNED_DIGEST: ${{ steps.publish.outputs.digest }}
          FINAL_TAG: ${{ steps.publish.outputs.final-tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker manifest inspect $env:FINAL_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite immutable package tag: $env:FINAL_TAG" }

          docker tag '${{ steps.image.outputs.image }}' $env:FINAL_TAG
          $promotedId = (& docker image inspect --format '{{.Id}}' $env:FINAL_TAG | Out-String).Trim()
          if ($promotedId -cne '${{ steps.image.outputs.image-id }}') {
            throw "Promotion changed image identity: expected ${{ steps.image.outputs.image-id }}, got $promotedId"
          }
          docker push $env:FINAL_TAG
          if ($LASTEXITCODE -ne 0) { throw "docker push failed for $env:FINAL_TAG" }

          $remoteManifest = (& docker manifest inspect --verbose $env:FINAL_TAG | Out-String) | ConvertFrom-Json
          $finalDigest = [string]$remoteManifest.Descriptor.digest
          if ($finalDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Could not resolve final manifest digest for $env:FINAL_TAG"
          }
          if ($finalDigest -cne $env:SIGNED_DIGEST) {
            throw "Final tag digest '$finalDigest' differs from signed staging digest '$env:SIGNED_DIGEST'."
          }
          Write-Host "Promoted signed digest $finalDigest to $env:FINAL_TAG"

      - name: Remove successful staging tag
        if: steps.pkg.outputs.up-to-date == 'False'
        continue-on-error: true
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          STAGING_TAG_NAME: ${{ steps.publish.outputs.staging-tag-name }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/Remove-DockerHubStagingTags.ps1 `
            -Repository $env:TLC_DOCKER_REPO `
            -Tag $env:STAGING_TAG_NAME

      - name: Upload release evidence
        if: always() && steps.pkg.outputs.up-to-date == 'False'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.pkg.outputs.name }}-${{ github.run_attempt }}
          path: |
            artifacts/${{ steps.pkg.outputs.name }}.spdx.json
            artifacts/${{ steps.pkg.outputs.name }}.provenance.json
            artifacts/${{ steps.pkg.outputs.name }}.trivy.sarif
            ${{ steps.pkg.outputs.vex }}
          if-no-files-found: warn
          retention-days: 90

      - name: Write package health summary
        if: always()
        shell: pwsh
        env:
          PACKAGE_SCRIPT: ${{ matrix.package }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          UP_TO_DATE: ${{ steps.pkg.outputs.up-to-date }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          SBOM_FALLBACK_OUTCOME: ${{ steps.fallback-sbom.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          VEX_PATH: ${{ steps.pkg.outputs.vex }}
        run: |
          $name = if ($env:PACKAGE_NAME) { $env:PACKAGE_NAME } else { $env:PACKAGE_SCRIPT }
          @(
            "## Package health: $name"
            ''
            '| Check | Result |'
            '|---|---|'
            "| Upstream state | $(if ($env:UP_TO_DATE -eq 'True') { 'Already current' } elseif ($env:UP_TO_DATE -eq 'False') { 'Built candidate' } else { 'Not reached' }) |"
            "| SPDX SBOM | $(if ($env:UP_TO_DATE -eq 'True') { 'Not required' } elseif ($env:SBOM_OUTCOME -eq 'success') { 'success' } elseif ($env:SBOM_FALLBACK_OUTCOME -eq 'success') { 'success (Trivy fallback)' } elseif ($env:SBOM_OUTCOME) { $env:SBOM_OUTCOME } else { 'Not reached' }) |"
            "| Trivy | $(if ($env:UP_TO_DATE -eq 'True') { 'Not required' } elseif ($env:TRIVY_OUTCOME) { $env:TRIVY_OUTCOME } else { 'Not reached' }) |"
            "| OpenVEX | $(if ($env:VEX_PATH) { $env:VEX_PATH } else { 'Not used' }) |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  package-health-summary:
    name: Package health summary
    needs: [init, validate, scanner-smoke, release]
    if: ${{ always() && needs.init.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Collect package job results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $jobs = @()
          $page = 1
          do {
            $batch = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100&page=$page" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read workflow job results.' }
            $jobs += @($batch.jobs)
            $page++
          } while ($jobs.Count -lt [int]$batch.total_count)

          $packages = @($jobs | Where-Object { $_.name -like 'Release (*' } | Sort-Object name | ForEach-Object {
            [pscustomobject]@{
              package = [regex]::Match([string]$_.name, '^Release \((.+)\)$').Groups[1].Value
              conclusion = [string]$_.conclusion
              url = [string]$_.html_url
            }
          })
          $document = [ordered]@{
            generatedAt = [datetime]::UtcNow.ToString('o')
            runId = [string]$env:GITHUB_RUN_ID
            packages = $packages
          }
          $document | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath artifacts/package-health.json -Encoding utf8

          @('## Package publication health', '', '| Package script | Result |', '|---|---|') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          foreach ($package in $packages) {
            "| [$($package.package)]($($package.url)) | $($package.conclusion) |" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if ($packages.Count -eq 0) {
            '| No publication jobs were selected | skipped |' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload package health data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-health-${{ github.run_attempt }}
          path: artifacts/package-health.json
          if-no-files-found: error
          retention-days: 90

  model-category-marker-plan:
    name: Plan model category markers
    needs: [init, validate, release]
    if: ${{ always() && needs.init.result == 'success' && needs.validate.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export desired model package names
        shell: pwsh
        run: |
          $planDirectory = Join-Path $env:RUNNER_TEMP 'model-category-marker-plan'
          New-Item -ItemType Directory -Path $planDirectory -Force | Out-Null
          .\scripts\export-model-category-marker-plan.ps1 `
            -OutputPath (Join-Path $planDirectory 'model-category-marker-plan.json') `
            -Repository $env:TLC_DOCKER_REPO

      - name: Upload model category marker plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-category-marker-plan
          path: ${{ runner.temp }}/model-category-marker-plan/model-category-marker-plan.json
          if-no-files-found: error
          retention-days: 1

  model-category-markers:
    name: Publish model category markers
    needs: [model-category-marker-plan]
    if: ${{ needs.model-category-marker-plan.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: package-release
    concurrency:
      group: toolchains-model-category-markers-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download model category marker plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model-category-marker-plan
          path: ${{ runner.temp }}/model-category-marker-plan

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Publish complete model category generation
        shell: pwsh
        run: |
          .\scripts\publish-model-category-markers.ps1 `
            -PlanPath (Join-Path $env:RUNNER_TEMP 'model-category-marker-plan/model-category-marker-plan.json') `
            -Repository $env:TLC_DOCKER_REPO
