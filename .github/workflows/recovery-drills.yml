# Toolchains | SPDX-License-Identifier: MPL-2.0
name: Recovery and Retention Drills

on:
  schedule:
    - cron: '43 6 1 * *'
  workflow_dispatch:
    inputs:
      package:
        description: Immutable package to verify without moving its alias
        required: true
        default: crane-linux
        type: string
      version:
        description: Immutable package version to verify
        required: true
        default: 0.21.9+1
        type: string

permissions:
  contents: read

concurrency:
  group: toolchains-recovery-retention-drills
  cancel-in-progress: false

env:
  TLC_DOCKER_REPO: ${{ vars.TLC_DOCKER_REPO || 'allsagetech/toolchains' }}

jobs:
  rollback-drill:
    name: Verify rollback without mutation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Cosign
        shell: pwsh
        run: ./.github/scripts/Install-VerifiedCosign.ps1
      - name: Verify immutable rollback evidence in WhatIf mode
        shell: pwsh
        env:
          PACKAGE: ${{ inputs.package || 'crane-linux' }}
          VERSION: ${{ inputs.version || '0.21.9+1' }}
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          if ($env:PACKAGE -notmatch '^[a-z0-9][a-z0-9._-]*$') { throw 'Drill package is invalid.' }
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Drill version is invalid.' }
          $tag = "$env:PACKAGE-$($env:VERSION.Replace('+','_'))"
          $source = "$env:TLC_DOCKER_REPO`:$tag"
          $manifest = (& docker buildx imagetools inspect $source --format '{{json .Manifest}}' | Out-String).Trim() | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect rollback drill target $source." }
          $digest = [string]$manifest.digest
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Rollback drill target has an invalid digest: $digest" }
          $result = ./scripts/rollback-package-tag.ps1 `
            -Repository $env:TLC_DOCKER_REPO `
            -Package $env:PACKAGE `
            -Version $env:VERSION `
            -AliasTag "$env:PACKAGE-stable" `
            -ExpectedDigest $digest `
            -WhatIf
          if ($result.Applied) { throw 'Rollback drill mutated the package alias.' }
          [ordered]@{
            schemaVersion = 1
            generatedAt = [datetime]::UtcNow.ToString('o')
            mode = 'what-if'
            package = $env:PACKAGE
            version = $env:VERSION
            targetDigest = $result.TargetDigest
            previousDigest = $result.PreviousDigest
            changed = [bool]$result.Changed
            applied = [bool]$result.Applied
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath evidence/rollback-drill.json -Encoding utf8
      - name: Upload rollback drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-drill-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  retention-drill:
    name: Inventory retention cleanup without deletion
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: package-release
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate dry-run retention inventory
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $staging = @(
            & ./.github/scripts/Remove-DockerHubStagingTags.ps1 `
              -Repository $env:TLC_DOCKER_REPO `
              -OlderThanDays 7 `
              -IncludeOrphanedAttachments `
              -DryRun *>&1
          )
          if (-not @($staging | Where-Object { [string]$_ -match 'Dry-run cleanup plan' })) { throw 'Staging retention drill did not produce a dry-run plan.' }
          $quarantine = @(
            & ./.github/scripts/Remove-DockerHubQuarantinedTags.ps1 `
              -Repository $env:TLC_DOCKER_REPO `
              -DryRun *>&1
          )
          if (-not @($quarantine | Where-Object { [string]$_ -match 'Dry-run quarantine cleanup plan' })) { throw 'Quarantine retention drill did not produce a dry-run plan.' }
          [ordered]@{
            schemaVersion = 1
            generatedAt = [datetime]::UtcNow.ToString('o')
            mode = 'dry-run'
            staging = @($staging | ForEach-Object { [string]$_ })
            quarantine = @($quarantine | ForEach-Object { [string]$_ })
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath evidence/retention-drill.json -Encoding utf8
      - name: Upload retention drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retention-drill-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
