name: Cleanup Docker Hub Release Tags

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      older_than_days:
        description: Delete abandoned tags at least this many days old
        required: true
        default: '7'
        type: string
      include_orphaned_attachments:
        description: Delete Cosign attachments that have no final image tag
        required: true
        default: true
        type: boolean
      include_quarantined_packages:
        description: Delete package tags selected by quarantined descriptors
        required: true
        default: true
        type: boolean
      dry_run:
        description: Show the cleanup plan without deleting tags
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: toolchains-package-publication-refs/heads/main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove abandoned release tags
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: package-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove abandoned tags through Docker Hub API
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TLC_DOCKER_REPO: ${{ vars.TLC_DOCKER_REPO || 'allsagetech/toolchains' }}
          OLDER_THAN_DAYS: ${{ inputs.older_than_days || '7' }}
          INCLUDE_ORPHANED_ATTACHMENTS: ${{ github.event_name != 'workflow_dispatch' || inputs.include_orphaned_attachments }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/Remove-DockerHubStagingTags.ps1 `
            -Repository $env:TLC_DOCKER_REPO `
            -OlderThanDays ([int]$env:OLDER_THAN_DAYS) `
            -IncludeOrphanedAttachments:([bool]::Parse($env:INCLUDE_ORPHANED_ATTACHMENTS)) `
            -DryRun:([bool]::Parse($env:DRY_RUN))

      - name: Remove quarantined packages through Docker Hub API
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_quarantined_packages }}
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TLC_DOCKER_REPO: ${{ vars.TLC_DOCKER_REPO || 'allsagetech/toolchains' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/Remove-DockerHubQuarantinedTags.ps1 `
            -Repository $env:TLC_DOCKER_REPO `
            -DryRun:([bool]::Parse($env:DRY_RUN))
